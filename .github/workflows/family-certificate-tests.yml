name: CDKA family certificate exact tests
on:
  push:
    paths:
      - 'cdka/family_certificate.py'
      - 'benchmarks/tests/test_family_certificate.py'
      - '.github/workflows/family-certificate-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11','3.12','3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.16.3'
      - run: python -m unittest discover -s benchmarks/tests -v
