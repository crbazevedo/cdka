name: CDKA v20 exact context audit
on:
  push:
    branches: [research/v20-coupled-verification]
    paths: ['cdka/context_product.py', 'tests/test_context_product.py', 'experiments/official_context_audit.py', '.github/workflows/v20-context-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v20-coupled-verification
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned official tools
        run: python -m pip install 'numpy==2.3.4' 'stormpy==2.0.0'
      - name: Verify exact reduction and independent small oracles
        run: |
          mkdir -p research/v20/evidence/audit_2026_11_06
          python -m unittest discover -s tests -p 'test_context_product.py' -v 2>&1 | tee research/v20/evidence/audit_2026_11_06/tests.log
      - name: One-query matched fresh-process benchmark
        run: python -u experiments/official_context_audit.py research/v20/evidence/audit_2026_11_06
      - name: Preserve complete evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdka-v20-context-audit
          path: research/v20/evidence/audit_2026_11_06
      - name: Persist audit on research branch only
        if: always()
        run: |
          git config user.name 'CDKA reproducibility runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/v20/evidence/audit_2026_11_06
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: audited context compiler and official solver comparison [skip ci]'
            git push origin HEAD:research/v20-coupled-verification
          fi
