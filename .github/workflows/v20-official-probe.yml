name: CDKA v20 official solver probe
on:
  push:
    branches: [research/v20-coupled-verification]
    paths:
      - 'experiments/v20_official_probe.py'
      - '.github/workflows/v20-official-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned official Storm bindings and numerical baseline
        run: python -m pip install 'stormpy==2.0.0' 'numpy==2.3.4'
      - name: Same-host subprocess benchmark
        run: python -u experiments/v20_official_probe.py
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdka-v20-official-probe
          path: v20_probe_evidence
