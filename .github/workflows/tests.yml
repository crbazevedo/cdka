name: CDKA finite baselines
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run independent exhaustive checks
        run: python -m unittest discover -s tests -v
      - name: Reproduce deterministic threshold table
        run: python -m experiments.threshold_sweep
