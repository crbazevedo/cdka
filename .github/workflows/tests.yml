name: CDKA finite baselines
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check browser module syntax
        run: |
          for module in docs/lab/*.mjs tests/*.test.mjs; do node --check "$module"; done
      - name: Verify all simulator kernels
        run: node --test tests/*.test.mjs
      - name: Verify canonical article synchronization
        run: node scripts/sync-articles.mjs --check
      - name: Check atlas completeness
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = ["B1","T1","T2","T3","T4","T5","T6"]
          for item in expected:
              path=Path("docs/articles") / f"{item}.md"
              assert path.exists(), path
              contents=path.read_text()
              for heading in ("Motivação","Definições mínimas","Formulação","Exemplo","O que habilita","Simulador"):
                  assert heading in contents,(item,heading)
          for item in ("T3C", "T3D", "T4C", "T3E-T4D", "T3F-T4F", "T4G"):
              assert (Path("docs/articles") / f"{item}.md").exists()
          assert (Path("docs")/"index.html").exists()
          for lab in ("causal_cut", "policy_cuts", "implementability", "reconfiguration", "composition"):
              assert (Path("docs")/"lab"/f"{lab}.html").exists()
          assert Path('registry/research-options.json').exists()
          print("Canonical articles, research option ledger, extensions and atlas entries verified.")
          PY
      - name: Run independent exhaustive checks
        run: python -m unittest discover -s tests -v
      - name: Reproduce exact research certificates
        run: |
          python -m experiments.threshold_sweep
          python -m experiments.causal_cut_sweep
          python -m experiments.policy_cuts_sweep
          python -m experiments.implementability_sweep
          python -m experiments.reconfiguration_sweep
          python -m experiments.composition_sweep
