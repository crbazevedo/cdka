name: V22 certified portfolio heldout replication
on:
  push:
    branches: ['research/v22-certified-portfolio']
    paths:
      - 'research/v22/cdka22/**'
      - 'research/v22/vendor/**'
      - 'research/v22/tests/**'
      - 'research/v22/experiments/**'
      - '.github/workflows/v22_certified_portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: research/v22
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v22-certified-portfolio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixed numerical training dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
      - name: Train structural costs and freeze before evaluation
        run: |
          set -euo pipefail
          mkdir -p evidence
          python experiments/study.py train | tee evidence/training.log
      - name: Evaluate held-out instances without modifying the selector
        run: |
          set -euo pipefail
          python experiments/study.py evaluate | tee evidence/holdout.log
      - name: Verify exact enclosures and provenance gates
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee evidence/tests.log
          python -O -m unittest discover -s tests -v 2>&1 | tee evidence/tests_optimized.log
      - name: Preserve independent replication evidence
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence
          git diff --cached --quiet || git commit -m 'evidence: v22 frozen-selector heldout replication with rational bounds [skip ci]'
          git push origin HEAD:research/v22-certified-portfolio
      - name: Preserve raw logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-certified-portfolio-evidence
          path: research/v22/evidence
