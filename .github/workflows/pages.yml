name: Publish CDKA Atlas
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'cdka/trace_microscope.py'
      - 'experiments/trace_sweep.py'
      - 'registry/v11-trace-addendum.json'
      - 'cdka/semantic_closure.py'
      - 'experiments/semantic_sweep.py'
      - 'registry/v12-semantic-addendum.json'
      - 'cdka/physical_update.py'
      - 'experiments/physical_update_sweep.py'
      - 'registry/v13-physical-update-addendum.json'
      - 'cdka/faulty_updates.py'
      - 'experiments/faulty_update_sweep.py'
      - 'registry/v14-stochastic-boundary-addendum.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify trace certificates and generate browser dataset
        run: |
          python -m unittest discover -s tests -p 'test_trace*.py' -v
          python -m experiments.trace_sweep --web docs/lab/trace-data.json
          mkdir -p docs/registry
          cp registry/v11-trace-addendum.json docs/registry/v11-trace-addendum.json
          sed -i 's|../../registry/v11-trace-addendum.json|../registry/v11-trace-addendum.json|g' docs/lab/trace_explorer.html
      - name: Verify semantic closure and generate exact dataset
        run: |
          python -m unittest discover -s tests -p 'test_semantic*.py' -v
          python -m experiments.semantic_sweep --write --check
          cp registry/v12-semantic-addendum.json docs/registry/v12-semantic-addendum.json
      - name: Verify physical update and generate exact frontier
        run: |
          python -m unittest discover -s tests -p 'test_physical_update*.py' -v
          python -m experiments.physical_update_sweep --write --check
          node --test tests/physical-update-lab.test.mjs
          cp registry/v13-physical-update-addendum.json docs/registry/v13-physical-update-addendum.json
      - name: Verify faulty boundaries and publish exact certificate
        run: |
          python -m unittest discover -s tests -p 'test_faulty*.py' -v
          python -m experiments.faulty_update_sweep --write --check
          node --test tests/faulty-update-lab.test.mjs
          cp registry/v14-stochastic-boundary-addendum.json docs/registry/v14-stochastic-boundary-addendum.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static atlas
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
